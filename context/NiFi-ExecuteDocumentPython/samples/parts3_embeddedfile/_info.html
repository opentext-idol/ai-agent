<div>
    <p>
        Embedded file parts of a FlowFileDocument are segments of a FlowFile containing binary file data.
    </p>
    <p>
        The following methods can be used to read and write embedded file parts in addition to the inherited operations from <a href="html/idolnifi.html#idolnifi.FileAction">FileAction</a>:
    </p>
	<ul style="list-style-type: disc">
		<li>with <a href="html/idolnifi.html#idolnifi.ContentFileAction.writeFile">ContentFileAction.writeFile</a>() as <a href="html/idolnifi.html#idolnifi.OutputStream">outputstream</a></li>
	</ul>
</div>
